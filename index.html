<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Green Room</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232ea36f'/><circle cx='16' cy='12.5' r='5' fill='%23fff'/><path d='M6.5 27c0-5.2 4.3-8.5 9.5-8.5s9.5 3.3 9.5 8.5z' fill='%23fff'/></svg>"
    />
  </head>
  <body>
    <div id="layout">
      <div id="stage"></div>
      <div id="panel">
        <h1>Green Room</h1>

        <h2>Load char from URL</h2>
        <label for="url">Character folder URL</label>
        <input id="url" type="text" placeholder="https://host/base/characters/MyCharacter/" />
        <div class="row" style="margin-top: 10px;">
          <button id="load" class="primary">Load from URL</button>
        </div>

        <h2>Load char from local dir</h2>
        <div class="row">
          <button id="pickdir" class="primary">Open folder…</button>
        </div>

        <h2>Emotes</h2>
        <div id="emotes"><span class="hint">Load a character to list emotes.</span></div>

        <label class="check"><input id="talking" type="checkbox" /> Talking</label>

        <h2>Animation phase</h2>
        <div id="states">
          <button data-state="preanim">Preanim</button>
          <button data-state="anim">Anim</button>
          <button data-state="postanim">Postanim</button>
        </div>

        <h2>Camera</h2>
        <label class="check"><input id="trackcam" type="checkbox" checked /> Track emote camera (VMD)</label>

        <h2>Animations in folder</h2>
        <div id="animations"><span class="hint">Open a local folder to list its .vmd files.</span></div>

        <h2>Play a file by name</h2>
        <label for="raw">Base name (no extension)</label>
        <input id="raw" type="text" placeholder="idle" />
        <div class="row" style="margin-top: 8px;">
          <button id="playraw">Play file</button>
        </div>
      </div>
    </div>
    <div id="status">Load a character from a URL or a local folder.</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
